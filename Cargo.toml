[package]
name = "stitch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Jon Hood <squinky86@gmail.com>"]
description = "A command-line tool to build a SQLite database from CWE, NIST 800-53, and NVD data"
readme = "README.md"
license = "MIT"
repository = "https://github.com/squinky86/STITCH"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
tokio = { version = "1.49", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
quick-xml = { version = "0.38", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml2 = "0.1.3"
serde_json = "1.0"
zip = "8.1"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
tempfile = "3.25"
regex = "1.12"
lazy_static = "1.5.0"
chrono = "0.4"
flate2 = "1.1"
indicatif = "0.18"
cvss = "2.2.0"
uuid = { version = "1.20", features = ["v4"] }
openssl = { version = "0.10.75", features = ["vendored"] }
