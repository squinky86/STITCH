[package]
name = "rusktex"
version = "0.1.0"
edition = "2021"
authors = ["RuskTeX Database Builder"]
description = "A command-line tool to build SQLite database from CWE, NIST 800-53, and NVD data"
license = "MIT"
repository = "https://github.com/squinky86/RuskTeX"

[dependencies]
tokio = { version = "1.47", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
rusqlite = { version = "0.37", features = ["bundled"] }
quick-xml = { version = "0.38", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
zip = "6.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
tempfile = "3.23"
regex = "1.12"
chrono = "0.4"
flate2 = "1.1"
indicatif = "0.18"
