[package]
name = "stitch"
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
authors = ["Jon Hood <squinky86@gmail.com>"]
description = "Build a SQLite database from CWE, NVD, NIST 800-53, ASD STIG, and CCI feeds, and estimate CVSS 4.0 scores from CWE/CVE/STIG identifiers"
readme = "README.md"
license = "MIT"
repository = "https://github.com/squinky86/STITCH"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
quick-xml = { version = "0.41", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml2 = "0.1.3"
serde_json = "1.0"
zip = { version = "8", default-features = false, features = ["deflate"] }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
tempfile = "3"
regex = "1"
chrono = "0.4"
flate2 = "1"
indicatif = "0.18"
cvss = "2.2.0"
uuid = { version = "1.20", default-features = false, features = ["v4"] }
