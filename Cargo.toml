[package]
name = "rusktex"
version = "0.1.0"
edition = "2021"
authors = ["RuskTeX Database Builder"]
description = "A command-line tool to build SQLite database from CWE, NIST 800-53, and NVD data"
license = "MIT"
repository = "https://github.com/squinky86/RuskTeX"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["stream"] }
rusqlite = { version = "0.29", features = ["bundled"] }
quick-xml = { version = "0.31", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
zip = "0.6"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
futures-util = "0.3"
tempfile = "3.10"
regex = "1.11"
chrono = "0.4"
flate2 = "1.0"
indicatif = "0.17"
