name: Rust CI & Release Builds

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  EXECUTABLES: stitch stitch-score

permissions:
  contents: read

jobs:

  # Offline test, lint, and audit. Replaces the live-network smoke build that
  # previously gated the rest of the workflow. The unit-test suite is the gate
  # now; the live build runs only on pushes to main (see smoke-build).
  test:
    name: Test, lint, audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, pinned 2026-09-24
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Live end-to-end DB build smoke test. Hits MITRE/NIST/DISA/GitHub/NVD and
  # takes ~30 minutes; gated behind pushes to main so PRs don't go red on a
  # transient upstream blip.
  smoke-build:
    name: Live build smoke test
    runs-on: ubuntu-24.04
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, pinned 2026-09-24
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --locked --release
      - run: ./target/release/stitch --output /tmp/stitch.db
        timeout-minutes: 60

  # Build for Linux MUSL (static linking)
  linux_musl_release:
    name: Linux MUSL Release
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, pinned 2026-09-24
        with:
          toolchain: 1.96.0
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build MUSL Release
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Package MUSL Binaries
        run: |
          ARTIFACT_DIR=target/x86_64-unknown-linux-musl/release
          ARTIFACT_NAME=rust-binaries-x86_64-unknown-linux-musl
          mkdir $ARTIFACT_NAME
          for exec in ${{ env.EXECUTABLES }}; do
            echo "Copying $exec from $ARTIFACT_DIR"
            cp $ARTIFACT_DIR/$exec $ARTIFACT_NAME/
          done
          tar -czvf $ARTIFACT_NAME.tar.gz $ARTIFACT_NAME
          sha256sum $ARTIFACT_NAME.tar.gz > $ARTIFACT_NAME.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-binaries-linux-musl
          path: |
            rust-binaries-x86_64-unknown-linux-musl.tar.gz
            rust-binaries-x86_64-unknown-linux-musl.tar.gz.sha256

  # Build for Windows MSVC
  windows_release:
    name: Windows MSVC Release
    runs-on: windows-2025
    needs: [test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, pinned 2026-09-24
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build Windows Release
        run: cargo build --locked --release
      - name: Package Windows Binaries
        shell: pwsh
        run: |
          $ARTIFACT_DIR = "target\release"
          $ARTIFACT_NAME = "rust-binaries-x86_64-pc-windows-msvc"
          mkdir $ARTIFACT_NAME
          $executables = "${{ env.EXECUTABLES }}".Split(" ")
          foreach ($executable in $executables) {
              $sourcePath = Join-Path $ARTIFACT_DIR "$executable.exe"
              Write-Host "Copying $sourcePath"
              Copy-Item -Path $sourcePath -Destination $ARTIFACT_NAME
          }
          Compress-Archive -Path $ARTIFACT_NAME -DestinationPath "$ARTIFACT_NAME.zip"
          $hash = (Get-FileHash "$ARTIFACT_NAME.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $ARTIFACT_NAME.zip" | Set-Content "$ARTIFACT_NAME.zip.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-binaries-windows-msvc
          path: |
            rust-binaries-x86_64-pc-windows-msvc.zip
            rust-binaries-x86_64-pc-windows-msvc.zip.sha256
