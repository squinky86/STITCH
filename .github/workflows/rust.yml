name: Rust CI & Release Builds

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  EXECUTABLES: stitch stitch-score

jobs:

  # Standard CI check for building and running tests on Linux
  test:
    name: Audits and Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install clippy
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        profile: minimal
        components: clippy
    - name: Run Dependency Audit
      uses: actions-rs/audit-check@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Run Clippy
      uses: actions-rs/clippy-check@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        args: -- -D warnings
    - name: Build and Test
      run: |
        cargo build --verbose
        # Testing one of the executables as an example
        target/debug/stitch

  # Build for Linux MUSL (static linking)
  linux_musl_release:
    name: Linux MUSL Release
    runs-on: ubuntu-latest
    # Ensure tests pass before building release artifacts
    needs: [test]
    steps:
    - uses: actions/checkout@v4
    - name: Install musl tools
      run: sudo apt install -y musl-tools
    - name: Install musl target
      # Add the static target for cross-compilation
      run: rustup target add x86_64-unknown-linux-musl
    - name: Build MUSL Release
      # Compile using the installed target
      run: cargo build --release --target x86_64-unknown-linux-musl
    - name: Package MUSL Binaries
      # Create a directory and tar.gz package containing all executables
      run: |
        ARTIFACT_DIR=target/x86_64-unknown-linux-musl/release
        ARTIFACT_NAME=rust-binaries-x86_64-unknown-linux-musl
        mkdir $ARTIFACT_NAME
        
        # Loop through all specified executables and copy them into the package folder
        for exec in ${{ env.EXECUTABLES }}; do
          echo "Copying $exec from $ARTIFACT_DIR"
          cp $ARTIFACT_DIR/$exec $ARTIFACT_NAME/
        done
        
        # Use tar.gz for Linux packaging
        tar -czvf $ARTIFACT_NAME.tar.gz $ARTIFACT_NAME
    - name: Upload Linux MUSL Artifact
      # Upload the package to the workflow run artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rust-binaries-linux-musl
        path: rust-binaries-x86_64-unknown-linux-musl.tar.gz

  # Build for Windows MSVC
  windows_release:
    name: Windows MSVC Release
    # Use a Windows runner
    runs-on: windows-latest
    needs: [test]
    steps:
    - uses: actions/checkout@v4
    - name: Build Windows Release
      # Default target x86_64-pc-windows-msvc is used
      run: cargo build --release
    - name: Package Windows Binaries
      # Use PowerShell for Windows commands
      shell: powershell
      run: |
        $ARTIFACT_DIR="target\release"
        $ARTIFACT_NAME="rust-binaries-x86_64-pc-windows-msvc"
        
        # Create directory
        mkdir $ARTIFACT_NAME
        
        # Loop through all specified executables, add the .exe suffix, and copy them
        $executables = "${{ env.EXECUTABLES }}".Split(" ")
        foreach ($executable in $executables) {
            $sourcePath = Join-Path $ARTIFACT_DIR "$executable.exe"
            Write-Host "Copying $sourcePath"
            Copy-Item -Path $sourcePath -Destination $ARTIFACT_NAME
        }
        
        # Zip the directory using Compress-Archive (PowerShell's built-in zip)
        Compress-Archive -Path $ARTIFACT_NAME -DestinationPath "$ARTIFACT_NAME.zip"
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rust-binaries-windows-msvc
        path: rust-binaries-x86_64-pc-windows-msvc.zip
        
